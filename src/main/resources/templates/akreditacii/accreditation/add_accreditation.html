<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
</head>
<body>
<div layout:fragment="subheader" th:include="akreditacii/subheader">
</div>

<div class="container mt-5 mb-3" layout:fragment="content">

    <h2 class="mb-4 text-center text-primary"
        th:text="${accreditation} != null ? 'Промени акредитација' : 'Креирај акредитација'"></h2>

    <form th:action="@{/admin/accreditations/add}" method="POST" class="p-4 border rounded shadow-sm bg-light">
        <div class="mb-3">
            <label for="year" class="form-label" th:text="#{YEAR}"></label>
            <input type="text" id="year" class="form-control" name="year" required="required"
                   th:value="(${accreditation} != null ? ${accreditation.getYear()} : '')"
                   th:readonly="${accreditation != null}" />
        </div>

        <div class="mb-3">
            <label for="dateFrom" class="form-label" th:text="#{ACTIVE_FROM}"></label>
            <input type="date" id="dateFrom" class="form-control" name="activeFrom" required="required"
                   th:value="(${accreditation} != null ? ${accreditation.getActiveFrom()} : '')"/>
        </div>

        <div class="mb-3">
            <label for="dateTo" class="form-label" th:text="#{ACTIVE_TO}"></label>
            <input type="date" id="dateTo" class="form-control" name="activeTo" required="required"
                   th:value="(${accreditation} != null ? ${accreditation.getActiveTo()} : '')"/>
        </div>

        <textarea class="form-control" name="studyProgramFields" hidden="true">;</textarea>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary" th:text="#{SUBMIT}"></button>
        </div>
    </form>
</div>

</body>
</html>
