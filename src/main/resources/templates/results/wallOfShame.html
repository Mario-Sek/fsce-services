<!doctype html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall of Shame</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
            crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>


<div layout:fragment="subheader" th:include="results/subheader"></div>


<div class="container py-5">
    <h1 class="text-center mb-4">Wall of Shame</h1>

    <div class="row">
        <!-- Professors with no results published -->
        <div class="col-md-6 mb-4">
            <h2 class="text-danger mb-3">Професори кои немаат објавено резултати во ниту една сесија</h2>
            <div class="card">
                <ul class="list-group list-group-flush">
                    <th:block th:each="professor : ${professorsNoResults}">
                        <li class="list-group-item" th:text="${professor.name}"></li>
                    </th:block>
                </ul>
            </div>
        </div>

        <!-- Professors late with publishing results -->
        <div class="col-md-6 mb-4">
            <h2 class="text-primary mb-3">Професори кои доцнеле со резултати</h2>
            <div class="card">
                <ul class="list-group list-group-flush">
                    <th:block th:each="professor : ${professorsLateResults}">
                        <li class="list-group-item" th:text="${professor.name}"></li>
                    </th:block>
                </ul>
            </div>
        </div>
    </div>
</div>


<div th:replace="~{fragments/footer :: footer}">&copy; 2024 The Wall of Shame</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
        crossorigin="anonymous"></script>
</body>
</html>
