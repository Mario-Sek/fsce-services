<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</head>
<body>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<div class="container-sm border border-secondary rounded p-3 mt-2 ">

    <div class="container-sm d-flex justify-content-center align-items-center">
        <h2 th:if="${report?.getStudent() != null}" th:text="${'Decision on report for student: ' + report.getStudent()?.getIndex()}"></h2>

    </div>

    <div class="alert alert-danger mt-2 d-flex align-items-center justify-content-center" role="alert" th:if="${reportError != null}">
        <h5>Professor with that username cannot be found.</h5>
    </div>

    <div class="alert alert-success mt-2 d-flex align-items-center justify-content-center" role="alert" th:if="${updateSuccessfull == true}">
        <h5>The report was successfully updated.</h5>
    </div>

    <form th:method="POST" th:action="@{'/record/{id}/decision'(id=${report?.getId()}, username=${username})}">

        <div class="form-group" th:if="${report?.getStudent() != null}">
            <label>Student Name and Surname:</label>
            <input type="text" name="dummy"
                   th:value="${report?.getStudent()?.getName() + ' ' + report?.getStudent()?.getLastName()}"
                   disabled class="form-control"> </br>
        </div>

        <div class="form-group">
            <label>Student Index</label>
            <input type="text" name="student_index"
                   th:value="${report?.getStudent()?.getIndex()}"
                   disabled
                   required class="form-control"> </br>
        </div>

        <div class="form-group">
            <label>Professor Username</label>
            <input type="text" name="professor_username"
                   th:value="${username}"
                   disabled
                   required
                   class="form-control">
            <input type="hidden" name="professor_username"
                   th:value="${username}"
                   class="form-control"></br>
        </div>

        <div class="form-group">
            <label>Course</label>
            <select disabled name="course" class="form-control">
                <option
                        th:each="course: ${courses}"
                        th:text="${course.getId()}"
                        th:selected="${report?.getCourse()?.getId()?.equals(course.getId())}"
                        th:value="${course.getId()}">
                </option>
            </select></br>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select disabled name="category" class="form-control">
                <option th:each="cat: ${categories}"
                        th:text="${cat.getName()}"
                        th:selected="${report?.getType()?.getId()?.equals(cat.getId())}"
                        th:value="${cat.getId()}">
                </option>
            </select></br>
        </div>

        <div class="form-group">
            <label>Degree</label>
            <input type="number" name="degree"
                   th:value="${report?.getSeverity()}"
                   disabled
                   required class="form-control"></br>

            <label>Report date</label>
            <input type="date" name="report_date"
                   disabled
                   th:value="${report?.getReportingDate()}"

                   required class="form-control"></br>
            <select disabled name="status" class="form-control">
                <option th:each="status: ${statuses}"
                        th:text="${status}"
                        th:selected="${report?.getStatus()?.equals(status)}"
                        th:value="${status}">
                </option>
            </select>

            <label>Report Note</label>
            <textarea type="text" name="report_note"
                      th:text="${report?.getDescription()}"
                      th:value="${report?.getDescription()}"
                      disabled
                      required class="form-control" rows="3"></textarea></br>

            <label>Decision name</label>
            <div class="form-group">
                <div>
                    <label th:each="sanction: ${report?.getSuggestedDisciplinarySanction()}" class="form-check-label">
                        <input type="radio" name="decision_name" th:value="${sanction.getName()}" class="form-check-input">
                        <span th:text="${sanction.getName()}"></span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <input type="radio" id="addNewSanction" name="decision_name" value="new" class="form-check-input">
                <label for="addNewSanction" class="form-check-label">Add new sanction:</label>
            </div>

            <script>
                $(document).ready(function() {
                    $('#addNewSanction').change(function() {
                        if ($(this).is(':checked')) {
                            $('#newSanctionField').show();
                        } else {
                            $('#newSanctionField').hide();
                        }
                    });
                });
            </script>

            <div class="form-group" id="newSanctionField" style="display: none;">
                <input type="text" id="newSanctionName" name="new_sanction_name" class="form-control">
            </div></br>

            <label>Decision description</label>
            <textarea type="text" name="decision_description"
                   th:value="${report?.getSuggestedDisciplinarySanction()?.getDescription()}"
                      required class="form-control"></textarea></br>
        </div>

        <div class="form-group d-inline-block">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>

        <a href="/" class="btn btn-secondary">Back</a>

        <input type="text" name="username" style="display: none;" th:value="${username}">
    </form>

</div>
</body>
</html>
