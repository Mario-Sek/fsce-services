<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Meetings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</head>
<body>
<div layout:fragment="subheader" th:include="dosie/subheader"></div>

<div class="mt-4" layout:fragment="content">

    <form th:action="@{'/meetings'}" method="get">
        <div class="row justify-content-center">
            <div class="form-group col-sm-2">
                <label for="professor" class="col-form-label">Professor:</label>
                <select id="professor" name="professor" class="form-control">
                    <option value="">Select Professor</option>
                    <option th:each="prof : ${professors}"
                            th:value="${prof.id}" th:text="${prof.name}">
                    </option>
                </select>
            </div>
            <div class="form-group col-sm-2">
                <label for="record" class="col-form-label">Record:</label>
                <select id="record" name="record" class="form-control">
                    <option value="">Select Record</option>
                    <option th:each="record : ${records}"
                            th:value="${record.id}" th:text="${record.id}">
                    </option>            </select>
            </div>
            <div class="form-group col-sm-2">
                <label for="date" class="col-form-label">Date:</label>
                <input type="date" id="date" name="date" class="form-control">
            </div>
        </div>
        <div class="h-200 mt-4 d-flex align-items-center justify-content-center">
            <button type="submit" class=" col-sm-2 btn btn-primary">Apply Filters</button>
        </div>
        <br>
        <br>
        <input type="text" name="username" style="display: none;" th:value="${username}">
    </form>

    <table class="table table-hover table-bordered">
        <thead class="table-secondary sticky-top">
        <tr class="text-center align-middle">
            <th>Meeting Date</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="meeting: ${meetingsPage.getContent()}" class="text-center align-middle">
            <td th:text="${meeting.getDisciplinaryMeetingDate()}"></td>
            <td class="d-flex justify-content-center align-items-center">
                <form method="get" th:action="@{'meeting/edit/{id}' (id=${meeting.getId()}, username=${username})}">
                    <button class="btn btn-success">Edit</button>
                    <input type="text" name="username" style="display: none;" th:value="${username}">
                </form>
            </td>

        </tr>
        </tbody>
    </table>

    <div th:include="fragments/paging :: pageSection(${meetingsPage})"></div>

    <form method="get" th:action="@{'/'}">
        <button class="btn btn-secondary" style="margin-left: 10px">Back</button>
    </form>
</div>
</body>
</html>
