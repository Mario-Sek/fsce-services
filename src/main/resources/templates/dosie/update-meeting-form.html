<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Update Meeting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</head>
<body>

<div layout:fragment="subheader" th:include="dosie/subheader"></div>

<div layout:fragment="content">

    <div class="container-sm border border-secondary rounded p-3 mt-4">

        <div class="container-sm d-flex justify-content-center align-items-center">
            <h2>Update Meeting</h2>
        </div>

        <div class="alert alert-danger mt-2 d-flex align-items-center justify-content-center" role="alert" th:if="${errorMessage != null}">
            <h5 th:text="${errorMessage}"></h5>
        </div>

        <div class="alert alert-success mt-2 d-flex align-items-center justify-content-center" role="alert" th:if="${successMessage != null}">
            <h5 th:text="${successMessage}"></h5>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-secondary text-white">
                <h4>Disciplinary Record Details</h4>
            </div>
            <div class="card-body">
                <p><strong>Student:</strong> <span th:text="${record.student.index + ' ' + record.student.name + ' ' + record.student.lastName}"></span></p>
                <p>
                    <strong>Current Meeting:</strong>
                    <span th:if="${record.meeting != null}" class="text-success" th:text="${#temporals.format(record.meeting.disciplinaryMeetingDate, 'yyyy-MM-dd')}"></span>
                    <span th:if="${record.meeting == null}" class="text-danger fst-italic">Not assigned</span>
                </p>
            </div>
        </div>

        <form th:action="@{'/reports/edit-meeting/' + ${record.id}}" method="post">
            <div class="form-group mb-3">
                <label for="meetingId">Select New Meeting:</label>
                <select class="form-control" id="meetingId" name="meetingId" required>
                    <option value="">-- Select a meeting --</option>
                    <option th:each="meeting : ${meetings}"
                            th:value="${meeting.id}"
                            th:text="${#temporals.format(meeting.disciplinaryMeetingDate, 'yyyy-MM-dd')}"
                            th:selected="${record.meeting != null and record.meeting.id == meeting.id}">
                    </option>
                </select>
            </div>

            <div class="mt-3">
                <div class="form-group d-inline-block me-2">
                    <button type="submit" class="btn btn-primary">Update Meeting</button>
                </div>
                <a th:href="@{/reports}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
