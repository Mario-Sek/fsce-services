<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Meeting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h2>Update Meeting Assignment</h2>
        </div>
        <div class="card-body">

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>


            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Disciplinary Record Details</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted">Student:</label>
                        <div class="fs-5">
                            <span th:text="${record.student.index + '  ' + record.student.name + ' ' + record.student.lastName}"></span>
                        </div>
                    </div>

                    <div>
                        <label class="form-label fw-bold text-muted">Current Meeting:</label>
                        <div class="fs-5">
                <span th:if="${record.meeting != null}"
                      class="text-success"
                      th:text="${#temporals.format(record.meeting.disciplinaryMeetingDate, 'yyyy-MM-dd')}"></span>
                            <span th:if="${record.meeting == null}" class="text-danger fst-italic">Not assigned</span>
                        </div>
                    </div>
                </div>
            </div>

            <form th:action="@{'/reports/edit-meeting/' + ${record.id}}" method="post">
                <div class="mb-3">
                    <label for="meetingId" class="form-label">Select New Meeting:</label>
                    <select class="form-select" id="meetingId" name="meetingId" required>
                        <option value="">-- Select a meeting --</option>
                        <option th:each="meeting : ${meetings}"
                                th:value="${meeting.id}"
                                th:text="${#temporals.format(meeting.disciplinaryMeetingDate, 'yyyy-MM-dd')}"
                                th:selected="${record.meeting != null and record.meeting.id == meeting.id}">
                        </option>
                    </select>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a th:href="@{'/reports'}" class="btn btn-secondary me-md-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update Meeting</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
