<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</head>
<body>
<div layout:fragment="subheader" th:include="dosie/subheader"></div>

<div class="mt-4" layout:fragment="content">
    <form th:action="@{'/reports'}" method="get">
        <div class="row">
            <div class="form-group col-sm-2">
                <label for="status" class="col-sm-2 col-form-label">Status:</label><x></x>
                <select id="status" name="status" class="form-control col-sm-2">
                    <option value="">Select Status</option>
                    <option th:each="stat : ${status}"
                            th:value="${stat}" th:text="${stat}">
                    </option>
                </select>
            </div>
            <div class="form-group col-sm-3">
                <label for="professor" class="col-sm-3 col-form-label">Professor:</label>
                <select id="professor" name="professor" class="form-control col-sm-2">
                    <option value="">Select Professor</option>
                    <option th:each="prof : ${professor}"
                            th:value="${prof.id}" th:text="${prof.name}">
                    </option>
                </select>
            </div>
            <div class="form-group col-sm-2">
                <label for="subject" class="col-sm-2 col-form-label">Subject:</label>
                <select id="subject" name="subject" class="form-control col-sm-2">
                    <option value="">Select Subject</option>
                    <option th:each="subj : ${subject}"
                            th:value="${subj.id}" th:text="${subj.name}">
                    </option>            </select>
            </div>
            <div class="form-group col-sm-2">
                <label for="meeting" class="col-sm-2 col-form-label">Meeting:</label>
                <select id="meeting" name="meeting" class="form-control col-sm-2">
                    <option value="">Select Meeting</option>
                    <option th:each="meet : ${meeting}"
                            th:value="${meet.id}" th:text="${meet.title}">
                    </option>            </select>
            </div>
            <div class="form-group col-sm-3">
                <label for="suggestedSanction" class="col-sm-12 col-form-label">Suggested Sanction:</label>
                <select id="suggestedSanction" name="suggestedSanction" class="form-control">
                    <option value="">Select Suggested Sanction</option>
                </select>
            </div>
        </div>
        <div class="h-200 mt-4 d-flex align-items-center justify-content-center">
            <button type="submit" class=" col-sm-2 btn btn-primary">Apply Filters</button>
        </div>
        <br>
        <br>
        <input type="text" name="username" style="display: none;" th:value="${username}">
    </form>
    <table class="table table-hover table-bordered">
        <thead class="table-secondary sticky-top">
        <tr class="text-center align-middle">
            <th>Student</th>
            <th>Course</th>
            <th>Professor</th>
            <th>Category</th>
            <th>Severity</th>
            <th>Report Note</th>
            <th>Reported Date</th>
            <th>Status</th>
            <th>Meeting</th>
            <th>Decision</th>
            <th>Sanction</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="report : ${allReports}" class="text-center align-middle">
            <td th:text="${report.getStudent().getIndex()}+' '+${report.getStudent().getName()}+' '+${report.getStudent().getLastName()}"></td>
            <td th:text="${report.getJoinedSubject().getAbbreviation()}"></td>
            <td th:text="${report.getReporter().getName()}"></td>
            <td th:text="${report.getType().getName()}"></td>
            <td th:text="${report.getSeverity()}"></td>
            <td th:text="${report.getDescription()}"></td>
            <td th:text="${report.getReportingDate()}"></td>
            <td th:text="${report.getStatus()}"></td>
            <td th:text="${report.getMeeting() != null ? report.getMeeting().getDisciplinaryMeetingDate() : ''}"></td>
            <td>
                <a th:href="@{'/disciplinary/' + ${report.getId()} + '/decision'}" class="btn btn-primary btn-sm">
                    <span th:if="${report.getDecision() == null}">Set<br>Decision</span>
                    <span th:if="${report.getDecision() != null}">View<br>Decision</span>
                </a>
            </td>
            <td th:text="${report.getDecision() != null and report.getDecision().getSanction() != null
              ? report.getDecision().getSanction().getName() : ''}">
            </td>


        </tr>
        </tbody>
    </table>

    <form method="get" th:action="@{'/'}">
        <button class="btn btn-secondary" style="margin-left: 10px">Back</button>
    </form>
</div>

</body>
</html>
