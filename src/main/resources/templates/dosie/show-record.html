<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Report review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</head>
<body>
<div layout:fragment="subheader" th:include="dosie/subheader"></div>

<div layout:fragment="content" class="mt-4">

    <div class="container-sm align-items-top" style="height: 75vh" th:if="${recordError != null}">

        <div class="alert alert-danger mt-5 d-flex align-items-center justify-content-center" role="alert" >
            <h5 th:text="${recordError}"></h5>
        </div>

    </div>

    <div class="container-sm border border-secondary rounded p-3 mt-2 " th:if="${recordError == null}">

        <div class="container-sm d-flex align-items-center justify-content-center m-2">
            <h2 class="text-center">Report review</h2>
        </div>

        <form th:method="POST" th:action="@{'/reports/review/{id}/add-note'(id=${record?.getId()})}">

            <div class="form-group" th:if="${record?.getStudent() != null}">
                <label>Student Name and Surname:</label>
                <input type="text"
                       name="student_name"
                       th:value="${record?.getStudent()?.getName() + ' ' + record?.getStudent()?.getLastName()}"
                       disabled
                       class="form-control"> <br/>
            </div>

            <div class="form-group">
                <label>Student Index</label>
                <input type="text"
                       name="student_index"
                       disabled
                       th:value="${record?.getStudent()?.getIndex()}"
                       required class="form-control"> <br/>
            </div>

            <div class="form-group">
                <label>Professor Username</label>
                <input type="text" name="professor_username"
                       th:value="${record?.getReporter().getName()}"
                       disabled
                       class="form-control"><br/>
            </div>

            <div class="form-group">
                <label>Course</label>
                <input type="text" name="course"
                       th:value="${record?.getJoinedSubject().getName()}"
                       disabled
                       class="form-control"><br/>
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" name="category"
                       th:value="${record?.getType().getName()}"
                       disabled
                       class="form-control"><br/>
            </div>

            <div class="form-group">
                <label>Degree</label>
                <input type="number" name="degree"
                       th:value="${record?.getSeverity()}"
                       disabled
                       class="form-control"><br/>
            </div>

            <div class="form-group">
                <label>Decision Name</label>
                <input type="text" name="decision_name"
                       th:value="${record?.getSuggestedDisciplinarySanction()?.getName()}"
                       disabled
                       class="form-control"><br/>
            </div>

            <div class="form-group">
                <label>Decision Description</label>
                <input type="text" name="decision_description"
                       th:value="${record?.getSuggestedDisciplinarySanction()?.getDescription()}"
                       disabled
                       class="form-control"><br/>
            </div>

            <div class="form-group">
                <label>Report Date</label>
                <input type="date" name="report_date"
                       th:value="${record?.getReportingDate()}"
                       disabled
                       class="form-control"><br/>
            </div>

            <div class="form-group">
                <label>Report Status</label>
                <input type="text" name="status"
                       th:value="${record?.getStatus()}"
                       disabled
                       class="form-control"><br/>
            </div>

            <div class="form-group">
                <label>Report Note</label>
                <textarea name="report_note"
                          th:text="${record?.getDescription()}"
                          th:value="${record?.getDescription()}"
                          disabled
                          class="form-control" rows="3"></textarea><br/>
            </div>

            <div class="form-group">
                <label>Meeting Date</label>
                <input type="text"
                       name="meeting"
                       th:value="${record?.meeting?.disciplinaryMeetingDate}"
                       disabled
                       class="form-control"><br/>
            </div>

            <div class="form-group">
                <label>Sanction Name</label>
                <input type="text"
                       name="sanction_name"
                       th:value="${record?.suggestedDisciplinarySanction?.name}"
                       disabled
                       class="form-control"><br/>
            </div>

            <div class="form-group">
                <label>Sanction Description</label>
                <input type="text"
                       name="sanction_description"
                       th:value="${record?.suggestedDisciplinarySanction?.description}"
                       disabled
                       class="form-control"><br/>
            </div>

            <hr/>

            <div class="form-group">
                <label>Admit Report Case</label>
                <select name="admit_report" class="form-control">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select><br/>
            </div>

            <div class="form-group">
                <label>Student Note</label>
                <textarea name="student_note"
                          th:text="${record?.getStudentNote()}"
                          th:value="${record?.getStudentNote()}"
                          required
                          class="form-control" rows="3">
                </textarea><br/>
            </div>

            <div class="form-group d-inline-block">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>

            <a href="/reports" class="btn btn-secondary">Back</a>
        </form>

    </div>



</div>

</body>
</html>
