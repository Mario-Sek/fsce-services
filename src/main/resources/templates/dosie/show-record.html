<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html" xmlns:layout="http://www.w3.org/1999/xhtml">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</head>
<body>
<div layout:fragment="subheader" th:include="dosie/subheader"></div>

<div class="container-sm border border-secondary rounded p-3 mt-2 ">

    <form th:method="POST" th:action="@{'/student/record/{id}/submit'(id=${report?.getId()}, username=${username})}">

        <div class="form-group" th:if="${report?.getStudent() != null}">
            <label>Student Name and Surname:</label>
            <input type="text" name="dummy"
                   th:value="${report?.getStudent()?.getName() + ' ' + report?.getStudent()?.getLastName()}"
                   disabled class="form-control"> </br>
        </div>

        <div class="form-group">
            <label>Student Index</label>
            <input type="text" name="student_index"
                   disabled
                   th:value="${report?.getStudent()?.getIndex()}"
                   required class="form-control"> </br>
            <input type="hidden" name="student_index_available" th:value="${report?.getStudent()?.getIndex()}">
        </div>

        <div class="form-group">
            <label>Professor Username</label>
            <input type="text" name="professor_username"
                   th:value="${report?.getReporter().getName()}"
                   disabled
                   required
                   class="form-control">
            <input type="hidden" name="professor_username"
                   th:value="${report?.getReporter().getName()}"
                   class="form-control"></br>
        </div>

        <div class="form-group">
            <label>Course</label>
            <input type="text" name="course"
                   th:value="${report?.getCourse().getId()}"
                   disabled
                   required
                   class="form-control"></br>
        </div>

        <div class="form-group">
            <label>Category</label>
            <input type="text" name="category"
                   th:value="${report?.getType().getName()}"
                   disabled
                   required
                   class="form-control"></br>
        </div>

        <div class="form-group">
            <label>Degree</label>
            <input type="number" name="degree"
                   th:value="${report?.getSeverity()}"
                   disabled
                   required class="form-control"></br>

            <label>Decision Name</label>
            <input type="text" name="decision_name"
                   th:value="${report?.getSuggestedDisciplinarySanction()?.getName()}"
                   disabled
                   required class="form-control"></br>

            <label>Decision Description</label>
            <input type="text" name="decision_description"
                   th:value="${report?.getSuggestedDisciplinarySanction()?.getDescription()}"
                   disabled
                   required class="form-control"></br>
            <label>Report Date</label>
            <input type="date" name="report_date"
                   th:value="${report?.getReportingDate()}"
                   disabled
                   required class="form-control"></br>

            <label>Report Status</label>
            <input type="text" name="status"
                   th:value="${report?.getStatus()}"
                   disabled
                   required
                   class="form-control"></br>

            <label>Report Note</label>
            <textarea type="text" name="report_note"
                      th:text="${report?.getDescription()}"
                      th:value="${report?.getDescription()}"
                      disabled
                      required class="form-control" rows="3"></textarea></br>

            <div class="form-group">
                <label>Meeting Date</label>
                <input type="text" name="meeting" th:value="${report?.meeting?.disciplinaryMeetingDate}" disabled required class="form-control">
            </div></br>

            <div class="form-group">
                <label>Sanction Name</label>
                <input type="text" name="sanction_name" th:value="${report?.suggestedDisciplinarySanction?.name}" disabled required class="form-control"></br>

                <label>Sanction Description</label>
                <input type="text" name="sanction_description" th:value="${report?.suggestedDisciplinarySanction?.description}" disabled required class="form-control"></br>
            </div>

            <label>Admit Report Case</label>
            <select name="admit_report" class="form-control">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select><br>

            <label>Student Note</label>
            <textarea type="text" name="student_note"
                      th:text="${report?.getStudentNote()}"
                      th:value="${report?.getStudentNote()}"
                      required class="form-control" rows="3"></textarea></br>
        </div>

        <div class="form-group d-inline-block">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>

        <a href="/" class="btn btn-secondary">Back</a>

        <input type="text" name="username" style="display: none;" th:value="${username}">
    </form>

</div>
</body>
</html>
