<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meeting Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</head>
<body>

<div class="container-sm border border-secondary rounded p-3 mt-2 ">

    <div class="container-sm d-flex justify-content-center align-items-center">
        <h2 th:if="${meeting?.disciplinaryMeetingDate == null}">Add a new meeting</h2>
        <h2 th:if="${meeting?.disciplinaryMeetingDate != null}" th:text="'Edit meeting for date: ' + ${meeting.disciplinaryMeetingDate}"></h2>
    </div>

    <!-- Error and Success Messages -->
    <div class="alert alert-danger mt-2 d-flex align-items-center justify-content-center" role="alert" th:if="${professorError != null}">
        <h5>Professor with that username cannot be found.</h5>
    </div>

    <div class="alert alert-success mt-2 d-flex align-items-center justify-content-center" role="alert" th:if="${meetingCreated}">
        <h5>The meeting was successfully created.</h5>
    </div>

    <div class="alert alert-success mt-2 d-flex align-items-center justify-content-center" role="alert" th:if="${updateSuccessfull}">
        <h5>The meeting was successfully updated.</h5>
    </div>

    <!-- Meeting Form -->
    <form th:method="POST" th:action="@{${meeting == null ? '/meeting/add/' : '/meeting/add/' + meeting.id}(username=${username})}">

        <!-- Meeting Date -->
        <div class="form-group">
            <label for="meetingDate">Date of meeting</label>
            <input type="date" id="meetingDate" name="meetingDate"
                   th:value="${date}"
                   required class="form-control">
        </div>
        <br>

        <!-- Students Selection -->
        <label for="students">Reported Students:</label>
        <select multiple class="form-control" id="students" name="students">
            <option th:each="student : ${students}" th:value="${student.index}"
                    th:text="${student.name + ' ' + student.lastName}"
                    th:selected="${selectedStudents != null and selectedStudents.contains(student.index)}">
            </option>
        </select>
        <br>

        <!-- Professors Selection -->
        <label for="professors">Professors:</label>
        <select multiple class="form-control" id="professors" name="professors">
            <option th:each="professor : ${professors}" th:value="${professor.id}"
                    th:text="${professor.name}"
                    th:selected="${selectedProfessors != null and selectedProfessors.contains(professor.id)}">
            </option>
        </select>

        <br>

        <!-- Submit Button -->
        <div class="form-group d-inline-block">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>

        <!-- Back Button -->
        <a th:href="@{'/meetings'(username=${username})}" th:if="${username != null}" class="btn btn-secondary">Back</a>

        <!-- Hidden Username Input -->
        <input type="hidden" name="username" th:value="${username}">
    </form>

</div>
</body>
</html>
