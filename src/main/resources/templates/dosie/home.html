<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</head>
<body>
<div layout:fragment="subheader" th:include="dosie/subheader"></div>
<div class="mt-4" layout:fragment="content">
    <div class="alert alert-danger mt-2 d-flex align-items-center justify-content-center" role="alert" th:if="${studentNotFoundFromSearch}">
        <h5>The searched student cannot be found.</h5>
    </div>

    <form th:action="@{'/reports'(username=${username})}" method="get">
        <div class="row">
            <div class="form-group col-sm-2">
                <label for="index" class="col-form-label">Student Index:</label>
                <input type="text" id="index" name="index" th:value="${index}" class="form-control">
            </div>
            <div class="form-group col-sm-2">
                <label for="status" class="col-form-label">Status:</label>
                <select id="status" name="status" class="form-control">
                    <option value="">Select Status</option>
                    <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
                </select>
            </div>
            <div class="form-group col-sm-2">
                <label for="professor" class="col-form-label">Professor:</label>
                <select id="professor" name="professor" class="form-control">
                    <option value="">Select Professor</option>
                    <option th:each="prof : ${professors}" th:value="${prof.id}" th:text="${prof.name}" th:selected="${prof.id == professor}"></option>
                </select>
            </div>
            <div class="form-group col-sm-2">
                <label for="subject" class="col-form-label">Subject:</label>
                <select id="subject" name="subject" class="form-control">
                    <option value="">Select Subject</option>
                    <option th:each="subj : ${subjects}" th:value="${subj.getAbbreviation()}" th:text="${subj.name}" th:selected="${subj.getAbbreviation() == subject}"></option>
                </select>
            </div>
            <div class="form-group col-sm-2">
                <label for="meeting" class="col-form-label">Meeting:</label>
                <select id="meeting" name="meeting" class="form-control">
                    <option value="">Select Meeting</option>
                    <option th:each="meet : ${meetings}" th:value="${meet.id}" th:text="${meet.disciplinaryMeetingDate}" th:selected="${meet.id == meeting}"></option>
                </select>
            </div>
            <div class="form-group col-sm-2">
                <label for="suggestedSanction" class="col-form-label">Suggested Sanction:</label>
                <select id="suggestedSanction" name="suggestedSanction" class="form-control">
                    <option value="">Select Suggested Sanction</option>
                    <option th:each="sanction : ${sanctions}" th:value="${sanction.id}" th:text="${sanction.name}" th:selected="${sanction.id == suggestedSanction}"></option>
                </select>
            </div>
        </div>
        <div class="h-200 mt-4 d-flex align-items-center justify-content-center">
            <button type="submit" class="col-sm-2 btn btn-primary">Apply Filters</button>
        </div>
        <br><br>
        <input type="text" name="username" style="display: none;" th:value="${username}">
    </form>

    <table class="table table-hover table-bordered">
        <thead class="table-secondary sticky-top">
        <tr class="text-center align-middle">
            <th>Student</th>
            <th>Course</th>
            <th>Professor</th>
            <th>Category</th>
            <th>Severity</th>
            <th>Report Note</th>
            <th>Reported Date</th>
            <th>Status</th>
            <th>Meeting</th>
            <th>Decision</th>
            <th>Sanction</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="report : ${allReports}" class="text-center align-middle">
            <td th:text="${report.getStudent().getIndex()}+' '+${report.getStudent().getName()}+' '+${report.getStudent().getLastName()}"></td>
            <td th:text="${report.getJoinedSubject().getAbbreviation()}"></td>
            <td th:text="${report.getReporter().getName()}"></td>
            <td th:text="${report.getType().getName()}"></td>
            <td th:text="${report.getSeverity()}"></td>
            <td th:text="${report.getDescription()}"></td>
            <td th:text="${report.getReportingDate()}"></td>
            <td th:text="${report.getStatus()}"></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
