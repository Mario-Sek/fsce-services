<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Disciplinary Decision</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</head>
<body>

<div layout:fragment="subheader" th:include="dosie/subheader"></div>

<div layout:fragment="content">

<div class="container-sm border border-secondary rounded p-3 mt-4">

    <div class="container-sm d-flex justify-content-center align-items-center">
        <h2 th:if="${decision == null}">Set Disciplinary Decision</h2>
        <h2 th:if="${decision != null}">View Disciplinary Decision</h2>
    </div>

    <div class="alert alert-success mt-2 d-flex align-items-center justify-content-center" role="alert" th:if="${successMessage != null}">
        <h5 th:text="${successMessage}"></h5>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-secondary text-white">
            <h4>Report Information</h4>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Student:</strong> <span th:text="${record.student.name + ' ' + record.student.lastName}"></span></p>
                    <p><strong>Subject:</strong> <span th:text="${record.joinedSubject.name}"></span></p>
                    <p><strong>Type:</strong> <span th:text="${record.type.name}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Reporting Date:</strong> <span th:text="${record.reportingDate}"></span></p>
                    <p><strong>Reporter:</strong> <span th:text="${record.reporter.name}"></span></p>
                    <p><strong>Severity:</strong> <span th:text="${record.severity}"></span></p>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <p>
                        <strong>Note:</strong>
                        <span th:text="${record.description}"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <form th:method="POST" th:action="@{/disciplinary/{recordId}/decision(recordId=${record.id})}">

        <div class="form-group mb-3">
            <label for="sanctionId">Select Sanction:</label>
            <select class="form-control" id="sanctionId" name="sanctionId" required
                    th:disabled="${decision != null}">
                <option value="">-- Select a Sanction --</option>
                <option th:each="sanction : ${sanctions}"
                        th:value="${sanction.id}"
                        th:text="${sanction.name}"
                        th:selected="${decision != null && decision.sanction != null && decision.sanction.id == sanction.id}">
                </option>
            </select>
        </div>

        <div class="form-group mb-3">
            <label for="description">Decision Description:</label>
            <textarea class="form-control" id="description" name="description" rows="5"
                      th:disabled="${decision != null}"
                      th:text="${decision != null and decision.description != null ? decision.description : ''}">
            </textarea>
        </div>

        <div class="mt-3">
            <div class="form-group d-inline-block me-2" th:if="${decision == null}">
                <button type="submit" class="btn btn-primary">Set Decision</button>
            </div>
            <a th:href="@{/reports}" class="btn btn-secondary">Back to Reports</a>
        </div>

    </form>

    </div>

</div>
</body>
</html>
