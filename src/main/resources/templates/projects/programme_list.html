<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Scientific project programmes</title>
</head>
<body>
<div layout:fragment="subheader" th:include="projects/subheader"></div>
<div class="mt-4" layout:fragment="content">
    <h1>Scientific project programmes</h1>
</div>
<div class="view-content my-5" layout:fragment="content">
    <div class="item-list">
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th class="text-primary">Name</th>
                <th class="text-primary">Grant Holder</th>
                <th class="text-primary">is international</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="programme : ${projectProgrammesPage.getContent()}">
                <td th:text="${programme.getName()}"/>
                </td>
                <td th:text="${programme.getGrantHolder().getName()}"></td>
                <td th:text="(${programme.getInternational()} == true) ? Да : Не"></td>
                <td class="text-right d-flex flex-wrap justify-content-end">
                    <div class="col-3">
                        <a th:href="@{'/scientific-programmes/edit-form/{id}'}"
                           class="btn btn-sm btn-info m-1">
                            <i th:text="#{EDIT}"></i>
                        </a>
                    </div>
                    <div class="col-3">
                        <a th:href="@{'/scientific-programmes/delete/{id}'}"
                           class="btn btn-sm btn-danger m-1">
                            <i th:text="#{DELETE}"></i>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div th:include="fragments/paging :: pageSection(${projectProgrammesPage})"></div>
    </div>
    <div class="col mb-3">
        <div class="row">
            <div class="col-sm-12 col-md-12 text-center">
                <a href="/scientific-programmes/add-form" class="btn btn-block btn-primary">Add Programme</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
