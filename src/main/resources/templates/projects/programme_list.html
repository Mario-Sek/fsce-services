<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Scientific project programmes</title>
    <style>
        .table tr {
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .table tr:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

    </style>
</head>
<body>
<div layout:fragment="subheader" th:include="projects/subheader"></div>
<div class="mt-4" layout:fragment="content">
    <div class="container lg mt-2">
        <h2>Scientific project programmes</h2>
        <div th:if="${errorMessage != null and !#strings.isEmpty(errorMessage)}" class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${errorMessage}" class="fw-bold"></span>
        </div>
        <div th:if="${successMessage != null and !#strings.isEmpty(successMessage)}" class="alert alert-success d-flex align-items-center" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${successMessage}" class="fw-bold"></span>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th class="text-center">Grant Holder</th>
                    <th class="text-center">is international</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="programme : ${projectProgrammesPage.getContent()}">
                    <td class="col-3"  th:text="${programme.getName()}"></td>
                    <td class="col-3 text-center"  th:text="${programme.getGrantHolder().getName()}"></td>
                    <td class="col-3 text-center"  th:text="(${programme.getInternational()} == true) ? Yes : No"></td>
                    <td>
                        <div class="d-flex align-items-center justify-content-end">
                            <div>
                                <a th:href="@{'/scientific-programmes/edit/{id}' (id=${programme.getId()})}"
                                   class="btn btn-sm btn-warning m-1">
                                    <i class="fas fa-pen-to-square"></i>
                                </a>
                            </div>
                            <div>
                                <form method="post" th:action="@{'/scientific-programmes/delete/{id}' (id=${programme.getId()})}" onclick="return confirm('Are you sure that you want to delete this programme')">
                                    <button type="submit" class="btn btn-danger btn-sm" style="text-align:center">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:include="fragments/paging :: pageSection(${projectProgrammesPage})"></div>
        <div class="col mb-3">
            <div class="row">
                <div class="col-sm-12 col-md-12 text-center">
                    <a href="/scientific-programmes/add" class="btn btn-block btn-primary">Add Programme</a>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
